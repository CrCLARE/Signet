 # ============================================================
# Deploy VitePress docs to GitHub Pages
#
# Deployed at: https://dev.crclare.top
#
# Triggers:
#   - Push to main when docs/ changes
#   - Manual trigger from the Actions tab
#
# First-time setup:
#   1. Settings -> Pages -> Source = "GitHub Actions"
#   2. Settings -> Pages -> Custom domain = "dev.crclare.top"
#   3. Add a CNAME record in your DNS: dev -> <username>.github.io
# ============================================================

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package.json

      - name: Install dependencies
        working-directory: docs
        run: npm install

      - name: Build VitePress
        working-directory: docs
        run: npx vitepress build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
