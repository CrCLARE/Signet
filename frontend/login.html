 <!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Signet</title>
  <meta name="robots" content="noindex" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: { 300:'#93c5fd', 400:'#60a5fa', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' }
          }
        }
      }
    }
  </script>

  <script>
    window.SIGNET_CONFIG = {
      apiBase: 'https://api.example.com',
      brandName: 'Signet',
      repoUrl: 'https://github.com/CrCLARE/Signet',
      docsUrl: 'https://dev.crclare.top',
      supportEmail: 'hi@example.com'
    };
  </script>

  <style>
    :root { color-scheme: dark; }
    html { background-color: #0b1020; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(900px 360px at 50% -10%, rgba(59,130,246,.25), transparent 60%), #0b1020;
      color: #e5e7eb;
      min-height: 100vh;
    }
    .auth-card {
      background-color: #131c33;
      border: 1px solid #1e2942;
      box-shadow: 0 12px 34px rgba(0,0,0,.35);
      border-radius: 22px;
    }
    .input-field {
      background-color: #0b1020;
      border: 1px solid #1e2942;
      color: #e5e7eb;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.2);
    }
    .btn-primary {
      background: linear-gradient(180deg,#3b82f6 0%,#2563eb 100%);
      color: #fff;
      box-shadow: 0 10px 24px -10px rgba(37,99,235,.55);
      transition: transform .2s ease, filter .3s ease;
    }
    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; filter: none; }
    .logo-mark {
      background: linear-gradient(135deg,#60a5fa 0%,#2563eb 100%);
      box-shadow: 0 8px 20px -8px rgba(37,99,235,.55);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <main class="flex-1 flex items-center justify-center px-6 py-12">

    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center gap-2 font-extrabold text-[20px] tracking-tight text-white">
          <span class="logo-mark w-9 h-9 rounded-xl flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L4 7v6c0 5 4 9 8 10 4-1 8-5 8-10V7l-8-5z" fill="white"/>
            </svg>
          </span>
          <span id="brandName">Signet</span>
        </a>
        <p class="mt-3 text-slate-400 text-[14px]">Sign in to manage your licenses</p>
      </div>

      <!-- Card -->
      <div class="auth-card p-8">
        <h1 class="text-[22px] font-bold text-slate-50 mb-6">Sign in</h1>

        <form id="loginForm" class="space-y-5" novalidate>
          <div>
            <label for="email" class="block text-[13px] font-medium text-slate-300 mb-2">
              Email
            </label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              class="input-field w-full px-4 py-3 rounded-xl text-[14px]"
              placeholder="you@example.com"
            />
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label for="password" class="block text-[13px] font-medium text-slate-300">
                Password
              </label>
              <a id="forgotLink" href="#" class="text-[12px] text-brand-400 hover:text-brand-300">
                Forgot password?
              </a>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
              class="input-field w-full px-4 py-3 rounded-xl text-[14px]"
              placeholder="••••••••"
            />
          </div>

          <button
            type="submit"
            id="submitBtn"
            class="btn-primary w-full py-3 rounded-xl font-semibold text-[15px]"
          >
            Sign in
          </button>

          <p id="errorMsg" class="hidden text-[13px] text-red-400 text-center"></p>
        </form>

        <div class="mt-6 pt-6 border-t border-white/5 text-center text-[13px] text-slate-400">
          Don't have an account?
          <a href="/register.html" class="text-brand-400 hover:text-brand-300 font-medium">
            Create one
          </a>
        </div>
      </div>

      <p class="mt-6 text-center text-[12px] text-slate-500">
        By signing in you agree to our
        <a href="/terms.html" class="underline hover:text-slate-300">Terms</a>
        and
        <a href="/privacy.html" class="underline hover:text-slate-300">Privacy Policy</a>.
      </p>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-white/5 py-6 bg-[#0b1020]">
    <div class="max-w-7xl mx-auto px-6 text-center text-[12px] text-slate-500">
      <p>
        <span id="footerBrand">Signet</span>
        © <span id="copyrightYear"></span>
        <a href="/" class="hover:text-slate-300">Home</a>
        <span class="mx-2 text-slate-700">·</span>
        <a id="footerDocs" href="#" target="_blank" class="hover:text-slate-300">Docs</a>
        <span class="mx-2 text-slate-700">·</span>
        <a id="footerRepo" href="#" target="_blank" class="hover:text-slate-300">GitHub</a>
      </p>
      <p class="mt-2">
        Powered by
        <a id="poweredBy" href="https://github.com/CrCLARE/Signet" target="_blank" class="text-brand-400 hover:text-brand-300">
          Signet
        </a>
      </p>
    </div>
  </footer>

  <script src="/assets/auth.js"></script>
  <script>
    // ============================================================
    // Apply runtime config
    // ============================================================
    (function () {
      const cfg = window.SIGNET_CONFIG || {};
      const brandName = cfg.brandName || 'Signet';

      document.title = 'Sign in — ' + brandName;

      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      };
      const setHref = (id, url) => {
        const el = document.getElementById(id);
        if (el && url) el.href = url;
      };

      setText('brandName', brandName);
      setText('footerBrand', brandName);
      setHref('footerDocs', cfg.docsUrl);
      setHref('footerRepo', cfg.repoUrl);

      // Forgot password → support email with prefilled subject
      if (cfg.supportEmail) {
        const subject = encodeURIComponent('[' + brandName + '] Password reset request');
        const body = encodeURIComponent(
          'Hi,\n\nI forgot my password. My account email is:\n\n\n' +
          'Please reset my password.\n\nThanks.'
        );
        setHref('forgotLink', 'mailto:' + cfg.supportEmail + '?subject=' + subject + '&body=' + body);
      } else {
        const el = document.getElementById('forgotLink');
        if (el) el.style.display = 'none';
      }
    })();

    document.getElementById('copyrightYear').textContent = new Date().getFullYear();

    // ============================================================
    // Login form
    // ============================================================
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('errorMsg');
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');

    // If already logged in, skip straight to the dashboard
    if (typeof AuthAPI !== 'undefined' && AuthAPI.getToken()) {
      location.replace('/dashboard.html');
    }

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    function hideError() {
      errEl.classList.add('hidden');
      errEl.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = emailEl.value.trim();
      const password = passwordEl.value;

      if (!email || !password) {
        showError('Please fill in both fields');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        await AuthAPI.login({ email, password });
        location.href = '/dashboard.html';
      } catch (err) {
        showError(err.message || 'Sign in failed');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    // Live-clear error while typing
    emailEl.addEventListener('input', hideError);
    passwordEl.addEventListener('input', hideError);
  </script>
</body>
</html>
