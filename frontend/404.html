 <!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Signet</title>
  <meta name="robots" content="noindex" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: { 300:'#93c5fd', 400:'#60a5fa', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' }
          }
        }
      }
    }
  </script>

  <script>
    window.SIGNET_CONFIG = {
      apiBase: 'https://api.example.com',
      brandName: 'Signet',
      repoUrl: 'https://github.com/CrCLARE/Signet',
      docsUrl: 'https://dev.crclare.top',
      supportEmail: 'hi@example.com'
    };
  </script>

  <style>
    :root { color-scheme: dark; }
    html { background-color: #0b1020; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0b1020;
      color: #e5e7eb;
      min-height: 100vh;
    }
    .bg-glow {
      background:
        radial-gradient(900px 360px at 50% -10%, rgba(59,130,246,.28), transparent 60%),
        radial-gradient(700px 300px at 85% 10%, rgba(96,165,250,.18), transparent 55%),
        linear-gradient(180deg,#0f172a 0%,#1e293b 45%,#0f172a 100%);
    }
    .big-404 {
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 60px rgba(59,130,246,.3);
      user-select: none;
    }
    .logo-mark {
      background: linear-gradient(135deg,#60a5fa 0%,#2563eb 100%);
      box-shadow: 0 8px 20px -8px rgba(37,99,235,.55);
    }
    .btn-primary {
      background: linear-gradient(180deg,#3b82f6 0%,#2563eb 100%);
      color: #fff;
      box-shadow: 0 10px 24px -10px rgba(37,99,235,.55);
      transition: transform .2s ease, filter .3s ease;
    }
    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn-ghost {
      background-color: rgba(255,255,255,.06);
      color: #e5e7eb;
      border: 1px solid rgba(255,255,255,.18);
      transition: background-color .3s ease, border-color .3s ease;
    }
    .btn-ghost:hover {
      background-color: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.35);
    }
  </style>
</head>
<body class="bg-glow flex items-center justify-center px-6 py-16">

  <div class="max-w-lg w-full text-center">

    <!-- Logo -->
    <a href="/" class="inline-flex items-center gap-2.5 font-extrabold text-[17px] tracking-tight text-white mb-12">
      <span class="logo-mark w-8 h-8 rounded-lg flex items-center justify-center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L4 7v6c0 5 4 9 8 10 4-1 8-5 8-10V7l-8-5z" fill="white"/>
        </svg>
      </span>
      <span id="brandName">Signet</span>
    </a>

    <!-- 404 -->
    <div class="big-404">404</div>

    <!-- Message -->
    <h1 class="mt-4 text-[22px] font-bold text-slate-100">
      Page not found
    </h1>
    <p class="mt-3 text-[15px] leading-relaxed text-slate-400">
      The page you're looking for doesn't exist, or it may have been moved.
    </p>
    <p id="requestedPath" class="mt-2 text-[13px] text-slate-500 font-mono break-all"></p>

    <!-- Actions -->
    <div class="mt-10 flex flex-wrap gap-3 justify-center">
      <a href="/" class="btn-primary px-6 py-3 rounded-xl font-semibold text-[14.5px]">
        Back to home
      </a>
      <a href="/verify.html" class="btn-ghost px-6 py-3 rounded-xl font-semibold text-[14.5px]">
        License lookup
      </a>
      <a id="docsLink" href="#" target="_blank" class="btn-ghost px-6 py-3 rounded-xl font-semibold text-[14.5px]">
        Docs
      </a>
    </div>

    <!-- Footer -->
    <div class="mt-16 pt-8 border-t border-white/5 text-[12.5px] text-slate-500">
      <p>
        <span id="footerBrand">Signet</span>
        © <span id="copyrightYear"></span>
      </p>
      <p class="mt-2">
        <a href="/" class="hover:text-slate-300">Home</a>
        <span class="mx-2 text-slate-700">·</span>
        <a id="footerRepo" href="#" target="_blank" class="hover:text-slate-300">GitHub</a>
        <span class="mx-2 text-slate-700">·</span>
        <a id="supportLink" href="#" class="hover:text-slate-300">Contact support</a>
      </p>
      <p class="mt-3">
        Powered by
        <a href="https://github.com/CrCLARE/Signet" target="_blank" class="text-brand-400 hover:text-brand-300">
          Signet
        </a>
      </p>
    </div>

  </div>

  <script>
    // ============================================================
    // Apply runtime config
    // ============================================================
    (function () {
      const cfg = window.SIGNET_CONFIG || {};
      const brandName = cfg.brandName || 'Signet';

      document.title = 'Page not found — ' + brandName;

      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      };
      const setHref = (id, url) => {
        const el = document.getElementById(id);
        if (el && url) el.href = url;
      };

      setText('brandName', brandName);
      setText('footerBrand', brandName);
      setHref('docsLink', cfg.docsUrl);
      setHref('footerRepo', cfg.repoUrl);

      // Support link — mailto with prefilled subject
      if (cfg.supportEmail) {
        const subject = encodeURIComponent('[' + brandName + '] Broken link report');
        setHref('supportLink', 'mailto:' + cfg.supportEmail + '?subject=' + subject);
      } else {
        const el = document.getElementById('supportLink');
        if (el) el.style.display = 'none';
      }

      // Show the path the user was trying to reach
      const requestedPath = location.pathname + location.search + location.hash;
      if (requestedPath && requestedPath !== '/') {
        const el = document.getElementById('requestedPath');
        el.textContent = requestedPath;
      }
    })();

    document.getElementById('copyrightYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
