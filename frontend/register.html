 <!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Signet</title>
  <meta name="robots" content="noindex" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: { 300:'#93c5fd', 400:'#60a5fa', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' }
          }
        }
      }
    }
  </script>

  <script>
    window.SIGNET_CONFIG = {
      apiBase: 'https://api.example.com',
      brandName: 'Signet',
      repoUrl: 'https://github.com/CrCLARE/Signet',
      docsUrl: 'https://dev.crclare.top'
    };
  </script>

  <style>
    :root { color-scheme: dark; }
    html { background-color: #0b1020; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(900px 360px at 50% -10%, rgba(59,130,246,.25), transparent 60%), #0b1020;
      color: #e5e7eb;
      min-height: 100vh;
    }
    .auth-card {
      background-color: #131c33;
      border: 1px solid #1e2942;
      box-shadow: 0 12px 34px rgba(0,0,0,.35);
      border-radius: 22px;
    }
    .input-field {
      background-color: #0b1020;
      border: 1px solid #1e2942;
      color: #e5e7eb;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.2);
    }
    .input-field.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,.15);
    }
    .btn-primary {
      background: linear-gradient(180deg,#3b82f6 0%,#2563eb 100%);
      color: #fff;
      box-shadow: 0 10px 24px -10px rgba(37,99,235,.55);
      transition: transform .2s ease, filter .3s ease;
    }
    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; filter: none; }
    .logo-mark {
      background: linear-gradient(135deg,#60a5fa 0%,#2563eb 100%);
      box-shadow: 0 8px 20px -8px rgba(37,99,235,.55);
    }
    .field-hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
    }
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
      margin-top: 8px;
    }
    .strength-fill {
      height: 100%;
      transition: width .25s ease, background-color .25s ease;
      width: 0;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <main class="flex-1 flex items-center justify-center px-6 py-12">

    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center gap-2 font-extrabold text-[20px] tracking-tight text-white">
          <span class="logo-mark w-9 h-9 rounded-xl flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L4 7v6c0 5 4 9 8 10 4-1 8-5 8-10V7l-8-5z" fill="white"/>
            </svg>
          </span>
          <span id="brandName">Signet</span>
        </a>
        <p class="mt-3 text-slate-400 text-[14px]">Create your account</p>
      </div>

      <!-- Card -->
      <div class="auth-card p-8">
        <h1 class="text-[22px] font-bold text-slate-50 mb-6">Sign up</h1>

        <form id="registerForm" class="space-y-5" novalidate>
          <div>
            <label for="email" class="block text-[13px] font-medium text-slate-300 mb-2">
              Email
            </label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              class="input-field w-full px-4 py-3 rounded-xl text-[14px]"
              placeholder="you@example.com"
            />
          </div>

          <div>
            <label for="nickname" class="block text-[13px] font-medium text-slate-300 mb-2">
              Display name
            </label>
            <input
              id="nickname"
              name="nickname"
              type="text"
              required
              maxlength="32"
              autocomplete="nickname"
              class="input-field w-full px-4 py-3 rounded-xl text-[14px]"
              placeholder="How you want to appear on the site"
            />
            <p class="field-hint">Shown on the public license lookup page.</p>
          </div>

          <div>
            <label for="password" class="block text-[13px] font-medium text-slate-300 mb-2">
              Password
            </label>
            <input
              id="password"
              name="password"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
              class="input-field w-full px-4 py-3 rounded-xl text-[14px]"
              placeholder="At least 8 characters"
            />
            <div class="strength-bar">
              <div id="strengthFill" class="strength-fill"></div>
            </div>
            <p id="strengthLabel" class="field-hint"></p>
          </div>

          <div>
            <label for="password2" class="block text-[13px] font-medium text-slate-300 mb-2">
              Confirm password
            </label>
            <input
              id="password2"
              name="password2"
              type="password"
              required
              autocomplete="new-password"
              class="input-field w-full px-4 py-3 rounded-xl text-[14px]"
              placeholder="Repeat your password"
            />
          </div>

          <label class="flex items-start gap-3 text-[13px] text-slate-400 leading-snug select-none cursor-pointer">
            <input
              id="agreeCheck"
              type="checkbox"
              class="mt-0.5 w-4 h-4 rounded border-slate-600 bg-slate-800 accent-brand-500"
            />
            <span>
              I agree to the
              <a href="/terms.html" class="text-brand-400 hover:text-brand-300 underline">Terms of Service</a>
              and
              <a href="/privacy.html" class="text-brand-400 hover:text-brand-300 underline">Privacy Policy</a>.
            </span>
          </label>

          <button
            type="submit"
            id="submitBtn"
            class="btn-primary w-full py-3 rounded-xl font-semibold text-[15px]"
          >
            Create account
          </button>

          <p id="errorMsg" class="hidden text-[13px] text-red-400 text-center"></p>
        </form>

        <div class="mt-6 pt-6 border-t border-white/5 text-center text-[13px] text-slate-400">
          Already have an account?
          <a href="/login.html" class="text-brand-400 hover:text-brand-300 font-medium">
            Sign in
          </a>
        </div>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-white/5 py-6 bg-[#0b1020]">
    <div class="max-w-7xl mx-auto px-6 text-center text-[12px] text-slate-500">
      <p>
        <span id="footerBrand">Signet</span>
        © <span id="copyrightYear"></span>
        <a href="/" class="hover:text-slate-300">Home</a>
        <span class="mx-2 text-slate-700">·</span>
        <a id="footerDocs" href="#" target="_blank" class="hover:text-slate-300">Docs</a>
        <span class="mx-2 text-slate-700">·</span>
        <a id="footerRepo" href="#" target="_blank" class="hover:text-slate-300">GitHub</a>
      </p>
      <p class="mt-2">
        Powered by
        <a id="poweredBy" href="https://github.com/CrCLARE/Signet" target="_blank" class="text-brand-400 hover:text-brand-300">
          Signet
        </a>
      </p>
    </div>
  </footer>

  <script src="/assets/auth.js"></script>
  <script>
    // ============================================================
    // Apply runtime config
    // ============================================================
    (function () {
      const cfg = window.SIGNET_CONFIG || {};
      const brandName = cfg.brandName || 'Signet';

      document.title = 'Create account — ' + brandName;

      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      };
      const setHref = (id, url) => {
        const el = document.getElementById(id);
        if (el && url) el.href = url;
      };

      setText('brandName', brandName);
      setText('footerBrand', brandName);
      setHref('footerDocs', cfg.docsUrl);
      setHref('footerRepo', cfg.repoUrl);
    })();

    document.getElementById('copyrightYear').textContent = new Date().getFullYear();

    // ============================================================
    // Refs
    // ============================================================
    const form = document.getElementById('registerForm');
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('errorMsg');

    const emailEl = document.getElementById('email');
    const nicknameEl = document.getElementById('nickname');
    const passwordEl = document.getElementById('password');
    const password2El = document.getElementById('password2');
    const agreeEl = document.getElementById('agreeCheck');

    const strengthFill = document.getElementById('strengthFill');
    const strengthLabel = document.getElementById('strengthLabel');

    // If already logged in, skip straight to the dashboard
    if (typeof AuthAPI !== 'undefined' && AuthAPI.getToken()) {
      location.replace('/dashboard.html');
    }

    // ============================================================
    // Error helpers
    // ============================================================
    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }
    function hideError() {
      errEl.classList.add('hidden');
      errEl.textContent = '';
    }
    function markInvalid(el) {
      el.classList.add('error');
    }
    function clearInvalid(el) {
      el.classList.remove('error');
    }

    [emailEl, nicknameEl, passwordEl, password2El].forEach(el => {
      el.addEventListener('input', () => {
        hideError();
        clearInvalid(el);
      });
    });

    // ============================================================
    // Email validation
    // ============================================================
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // ============================================================
    // Password strength meter
    // ============================================================
    function scorePassword(pwd) {
      let score = 0;
      if (!pwd) return 0;
      if (pwd.length >= 8) score++;
      if (pwd.length >= 12) score++;
      if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
      if (/\d/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;
      return Math.min(score, 4);
    }

    const STRENGTH_STATES = [
      { label: '', color: 'transparent', width: '0%' },
      { label: 'Too weak', color: '#ef4444', width: '25%' },
      { label: 'Weak', color: '#f59e0b', width: '50%' },
      { label: 'Good', color: '#3b82f6', width: '75%' },
      { label: 'Strong', color: '#10b981', width: '100%' }
    ];

    passwordEl.addEventListener('input', () => {
      const level = scorePassword(passwordEl.value);
      const state = STRENGTH_STATES[level];
      strengthFill.style.width = state.width;
      strengthFill.style.backgroundColor = state.color;
      strengthLabel.textContent = passwordEl.value ? state.label : '';
    });

    // ============================================================
    // Submit
    // ============================================================
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = emailEl.value.trim();
      const nickname = nicknameEl.value.trim();
      const password = passwordEl.value;
      const password2 = password2El.value;

      // Client-side validation
      if (!email) {
        markInvalid(emailEl);
        return showError('Please enter your email');
      }
      if (!EMAIL_RE.test(email)) {
        markInvalid(emailEl);
        return showError('Please enter a valid email address');
      }
      if (!nickname) {
        markInvalid(nicknameEl);
        return showError('Please enter a display name');
      }
      if (nickname.length > 32) {
        markInvalid(nicknameEl);
        return showError('Display name must be 32 characters or fewer');
      }
      if (password.length < 8) {
        markInvalid(passwordEl);
        return showError('Password must be at least 8 characters');
      }
      if (password !== password2) {
        markInvalid(password2El);
        return showError('Passwords do not match');
      }
      if (!agreeEl.checked) {
        return showError('Please agree to the Terms of Service');
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        await AuthAPI.register({ email, nickname, password });
        location.href = '/bind.html';
      } catch (err) {
        showError(err.message || 'Registration failed');
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
